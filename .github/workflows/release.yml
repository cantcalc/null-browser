name: Build and release NULL for macOS
'on':
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a version-matched Release after all checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: null-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan complete Git history (including initial root commit)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/gitleaks"

          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern
          gitleaks_8.30.1_checksums.txt --dir "$RUNNER_TEMP/gitleaks"

          cd "$RUNNER_TEMP/gitleaks"

          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt

          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz

          ./gitleaks git "$GITHUB_WORKSPACE" --redact --log-opts=--all
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run typecheck:electron
      - run: npm run build
      - run: npm run test:navigation
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run licenses
      - name: Version must match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME,'v'+require('./package.json').version)"
  packages:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            command: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Native macOS regression
        if: runner.os == 'macOS'
        run: |
          npm run test:tabs
          npm run test:core
          npm run test:runtime
          npm run test:ai
      - name: Package macOS (never publishes)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.command }}
      - run: npm run verify:release -- ${{ matrix.platform }}
      - name: macOS packaged runtime smoke
        if: runner.os == 'macOS'
        run: node scripts/smoke-installed.cjs 'release/mac-arm64/NULL.app/Contents/MacOS/NULL'
      - name: AI packaged UI (LaunchServices, real OS vault, mock provider transport)
        if: runner.os == 'macOS'
        env:
          NULL_AI_PACKAGED: 'true'
        run: node scratch/verify-ai-ui.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
            release/beta*.yml
            release/alpha*.yml
            release/*.blockmap
            release/artifact-manifest-*.json
            release/signing-status-*.json
            release/smoke-*.json
  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs:
      - validate
      - packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify manifests and create checksums
        run: node scripts/check-release-downloads.cjs release
      - name: Publish complete Release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(node -p "'v'+require('./package.json').version")"
          node scripts/ensure-release-tag.cjs
          if gh release view "$tag" --json isDraft --jq .isDraft >/tmp/existing-release 2>/dev/null; then
            if [ "$(cat /tmp/existing-release)" != "true" ]; then
              echo 'An already-published release will not be overwritten.'
              exit 1
            fi
          else
            gh release create "$tag" --draft --verify-tag --title "NULL $tag" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$tag" release/* --clobber
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            node scripts/require-stable-readiness.cjs
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
