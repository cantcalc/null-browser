name: Build and release NULL
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: null-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run typecheck:electron
      - run: npm run build
      - run: npm run test:navigation
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run licenses
      - name: Version must match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME,'v'+require('./package.json').version)"
  packages:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            command: npm run dist:mac
          - os: windows-2025
            platform: win32
            command: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Native macOS regression
        if: runner.os == 'macOS'
        run: |
          npm run test:tabs
          npm run test:core
          npm run test:runtime
      - name: Package macOS (never publishes)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.command }}
      - name: Package Windows (never publishes)
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ${{ matrix.command }}
      - run: npm run verify:release -- ${{ matrix.platform }}
      - name: macOS packaged runtime smoke
        if: runner.os == 'macOS'
        run: node scripts/smoke-installed.cjs 'release/mac-arm64/NULL.app/Contents/MacOS/NULL'
      - name: Windows install, runtime, restart, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem release/NULL-Setup-*.exe | Select-Object -First 1).FullName
          $install = Join-Path $env:RUNNER_TEMP 'NULL-install-qa'
          $installer = Start-Process -FilePath $setup -ArgumentList '/S',"/D=$install" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $exe = Join-Path $install 'NULL.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $signature = (Get-AuthenticodeSignature $exe).Status.ToString()
          @{platform='win32'; authenticodeStatus=$signature; installed=$true} | ConvertTo-Json | Set-Content release/signing-status-win.json
          node scripts/smoke-installed.cjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime smoke failed' }
          $uninstaller = (Get-ChildItem $install/*ninstall*.exe | Select-Object -First 1).FullName
          if (!$uninstaller) { throw 'Uninstaller missing' }
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          for ($i=0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'Uninstall left the main executable' }
          $smoke = Get-Content release/smoke-win32.json | ConvertFrom-Json
          $smoke | Add-Member -NotePropertyName silentInstallAndUninstall -NotePropertyValue $true
          $smoke | ConvertTo-Json | Set-Content release/smoke-win32.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/artifact-manifest-*.json
            release/signing-status-*.json
            release/smoke-*.json
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify manifests and create checksums
        run: node scripts/check-release-downloads.cjs release
      - name: Publish complete Release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq .isDraft >/tmp/existing-release 2>/dev/null; then
            if [ "$(cat /tmp/existing-release)" != "true" ]; then
              echo 'An already-published release will not be overwritten.'
              exit 1
            fi
          else
            gh release create "$tag" --draft --verify-tag --title "NULL $tag" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$tag" release/* --clobber
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            node scripts/require-stable-readiness.cjs
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
